name: Android Release APK

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Verify Hermes is enabled
        run: |
          grep -n "hermesEnabled" android/gradle.properties
          grep -q "hermesEnabled=true" android/gradle.properties

      - name: Build release APK
        working-directory: android
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: ./gradlew assembleRelease --no-build-cache

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shubhlabh-field-assistant-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
